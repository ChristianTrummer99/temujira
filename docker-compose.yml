services:
  app:
    build: .
    image: temujira:latest
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200
    ports:
      - "${TEMUJIRA_BIND:-127.0.0.1}:${TEMUJIRA_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      TEMUJIRA_ADMIN_EMAIL: ${TEMUJIRA_ADMIN_EMAIL:-}
      TEMUJIRA_ADMIN_PASSWORD: ${TEMUJIRA_ADMIN_PASSWORD:-}
      TEMUJIRA_ADMIN_NAME: ${TEMUJIRA_ADMIN_NAME:-Admin}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    restart: unless-stopped
